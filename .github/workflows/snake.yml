name: Generate Pacman

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: afrasiab006/pacman-contribution-graph@main
        with:
          github_user_name: Afrasiab006
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pacman-output
          publish_dir: ./pacman-output
          force_orphan: true
